name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: africa_live_dev
          POSTGRES_PASSWORD: password
          POSTGRES_DB: africa_live_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://africa_live_dev:password@localhost:5432/africa_live_dev
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_123456789
      DEPLOYMENT_ENV: local
      LOCAL_DEV_MODE: 'false'
      NEXT_PUBLIC_LOCAL_DEV_MODE: 'false'
      NEXT_PUBLIC_LOCAL_PLAYBACK: 'false'
      ENABLE_LOCAL_VLC: 'false'
      PLAYBACK_ELIGIBILITY_READY: 'false'
      PAYMENTS_ENABLED: 'false'
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      BROWSER_TEST_ORIGIN: http://localhost:3001
      E2E_BASE_URL: http://localhost:3001
      E2E_ANONYMOUS_MODE: 'true'
      PORT: '3001'
      # CI-only non-production credentials — not used unless PAYMENTS_ENABLED=true.
      # The validator only checks these when payment is enabled or partially configured.
      NABOOPAY_API_KEY: ''
      NABOOPAY_WEBHOOK_SECRET: ''


    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check Linting
      run: npm run lint

    - name: Check Types
      run: npx tsc --noEmit --incremental false

    - name: Audit production dependencies (required)
      run: npm audit --omit=dev --audit-level=moderate

    - name: Snyk Code SAST Scan (when available)
      run: |
        if [ -n "$SNYK_TOKEN" ]; then
          scan_log="$RUNNER_TEMP/snyk-code.log"
          if npx snyk code test > "$scan_log" 2>&1; then
            cat "$scan_log"
          else
            scan_status=$?
            if grep -q 'SNYK-CODE-0005' "$scan_log"; then
              echo "::warning::Snyk Code not run: the organization has not enabled Snyk Code (SNYK-CODE-0005)."
            else
              cat "$scan_log"
              exit "$scan_status"
            fi
          fi
        else
          echo "::warning::Snyk Code not run: no CI token configured."
        fi
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    - name: Apply Database Schema
      run: npm run db:migrate

    - name: Unit Tests
      run: npm test

    - name: Integration Tests
      run: npm run test:integration

    - name: Build
      run: npm run build

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: E2E Tests
      run: npx playwright test e2e/auth-entry.spec.ts e2e/catalogue.spec.ts e2e/payment.spec.ts e2e/radar-reliability.spec.ts
      env:
        E2E_EXTERNAL_SERVER: 'false'
        RADAR_BUILD_TEST: 'true'

    # Separate local development workstation mode: synthetic media/providers,
    # no real payment, no relaxation of the built staging/production app above.
    - name: Prepare isolated UI account
      id: ui_account
      run: npx tsx src/scripts/ui-fixture-user.ts --catalog

    - name: Sensitive UI regressions (local fixtures)
      run: npx playwright test --workers=1 e2e/catalogue.spec.ts e2e/tv-workspace.spec.ts e2e/tv-streaming.spec.ts e2e/player-dock.spec.ts e2e/followed-countries.spec.ts e2e/tv-wall.spec.ts e2e/universal-search.spec.ts e2e/radar-reliability.spec.ts e2e/local-playback.spec.ts e2e/local-playback-api.spec.ts
      env:
        E2E_DEV_SERVER: 'true'
        E2E_ANONYMOUS_MODE: 'false'
        LOCAL_DEV_MODE: 'true'
        NEXT_PUBLIC_LOCAL_DEV_MODE: 'true'
        NEXT_PUBLIC_LOCAL_PLAYBACK: 'true'
        NEXT_PUBLIC_TV_WALL: 'true'

    - name: Remove owned UI account
      if: always() && steps.ui_account.outcome == 'success'
      run: npx tsx src/scripts/ui-fixture-user.ts --cleanup

    - name: Upload E2E failure evidence
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-failures
        path: |
          playwright-report/
          test-results/
